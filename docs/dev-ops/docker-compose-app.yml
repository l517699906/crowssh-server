# /usr/local/bin/docker-compose -f /docs/dev-ops/environment/environment-docker-compose-2.4.yml up -d
version: '3.8'
# docker-compose -f docker-compose-app.yml up -d
# 你需要修改system为你自身系统的仓库名
services:
  ai-agent-scaffold:
    image: system/ai-agent-scaffold:1.0
    container_name: ai-agent-scaffold
    restart: on-failure
    ports:
      - "127.0.0.1:8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=PRC
      - SERVER_PORT=8091
      - SPRING_PROFILES_ACTIVE=prod
      - CROWSSH_CRYPTO_PRIMARY_KEY_ID=${CROWSSH_CRYPTO_PRIMARY_KEY_ID:-primary}
      - CROWSSH_CRYPTO_PRIMARY_KEY=${CROWSSH_CRYPTO_PRIMARY_KEY:?CROWSSH_CRYPTO_PRIMARY_KEY is required}
      - CROWSSH_CRYPTO_PREVIOUS_KEYS=${CROWSSH_CRYPTO_PREVIOUS_KEYS:-}
      - CROWSSH_CRYPTO_LEGACY_KEYS=${CROWSSH_CRYPTO_LEGACY_KEYS:-}
      - CROWSSH_DEVICE_REGISTRATION_ENABLED=${CROWSSH_DEVICE_REGISTRATION_ENABLED:-true}
      - CROWSSH_DEVICE_REGISTRATION_INVITE_CODE=${CROWSSH_DEVICE_REGISTRATION_INVITE_CODE:-}
      - CROWSSH_SSH_ALLOWED_PRIVATE_HOSTS=${CROWSSH_SSH_ALLOWED_PRIVATE_HOSTS:-}
    volumes:
      - ./log:/data/log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
