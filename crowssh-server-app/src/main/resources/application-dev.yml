server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  config:
    import:
#      - classpath:agent/test-agent.yml
#      - classpath:agent/only-one-agent.yml
#      - classpath:agent/parallel_research_app.yml
      - classpath:agent/ssh-agent.yml
  datasource:
    username: ${CROWSSH_DB_USERNAME:root}
    password: ${CROWSSH_DB_PASSWORD}
    url: ${CROWSSH_DB_URL:jdbc:mysql://127.0.0.1:3306/crowssh?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

# MyBatis-Plus 配置【如需使用记得打开】
mybatis-plus:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# 里程碑识别规则热加载
ai:
  agent:
    milestone:
      rules-file: ${MILESTONE_RULES_FILE:./config/milestone-rules.json}
      reload-interval-ms: ${MILESTONE_RULES_RELOAD_INTERVAL_MS:2000}
# 开发环境可通过环境变量显式放行受控内网测试目标，默认仍不放行。
crowssh:
  security:
    allowed-origins: ${CROWSSH_ALLOWED_ORIGINS:tauri://localhost,http://tauri.localhost,http://localhost:1420,http://localhost:5173}
  crypto:
    primary-key-id: ${CROWSSH_CRYPTO_PRIMARY_KEY_ID:primary}
    primary-key: ${CROWSSH_CRYPTO_PRIMARY_KEY:}
    previous-keys: ${CROWSSH_CRYPTO_PREVIOUS_KEYS:}
    legacy-keys: ${CROWSSH_CRYPTO_LEGACY_KEYS:}
    allow-insecure-development-key: ${CROWSSH_CRYPTO_ALLOW_INSECURE_DEVELOPMENT_KEY:false}
  auth:
    registration:
      enabled: ${CROWSSH_DEVICE_REGISTRATION_ENABLED:true}
      invite-code: ${CROWSSH_DEVICE_REGISTRATION_INVITE_CODE:}
      max-per-ip: ${CROWSSH_DEVICE_REGISTRATION_MAX_PER_IP:20}
      window-seconds: ${CROWSSH_DEVICE_REGISTRATION_WINDOW_SECONDS:3600}
      max-active-principals: ${CROWSSH_DEVICE_REGISTRATION_MAX_ACTIVE:1000}
  ssh:
    egress:
      allowed-private-hosts: ${CROWSSH_SSH_ALLOWED_PRIVATE_HOSTS:}
  # 终端会话治理：空闲 TTL / 回收周期 / 单用户配额
  session:
    idle-timeout-millis: ${CROWSSH_SESSION_IDLE_TIMEOUT_MILLIS:1800000}
    reap-interval-ms: ${CROWSSH_SESSION_REAP_INTERVAL_MS:60000}
    max-sessions-per-owner: ${CROWSSH_SESSION_MAX_PER_OWNER:10}
  db:
    session:
      idle-timeout-millis: ${CROWSSH_DB_IDLE_TIMEOUT_MILLIS:1800000}
      reap-interval-ms: ${CROWSSH_DB_REAP_INTERVAL_MS:60000}
      max-sessions-per-owner: ${CROWSSH_DB_MAX_SESSIONS_PER_OWNER:10}
      max-sessions-global: ${CROWSSH_DB_MAX_SESSIONS_GLOBAL:50}
    egress:
      allowed-private-hosts: ${CROWSSH_DB_ALLOWED_PRIVATE_HOSTS:}
      allowed-tunnel-targets: ${CROWSSH_DB_ALLOWED_TUNNEL_TARGETS:}
  # ReAct 循环护栏：步数 / 工具调用 / token 预算 / 墙钟超时
  react:
    max-steps: ${CROWSSH_REACT_MAX_STEPS:50}
    max-tool-calls: ${CROWSSH_REACT_MAX_TOOL_CALLS:200}
    max-tool-calls-per-round: ${CROWSSH_REACT_MAX_TOOL_CALLS_PER_ROUND:10}
    token-budget: ${CROWSSH_REACT_TOKEN_BUDGET:8000}
    wall-clock-timeout-millis: ${CROWSSH_REACT_WALL_CLOCK_TIMEOUT_MILLIS:600000}
  # SSE 流式执行器：并发上限（背压）/ 心跳线程数
  sse:
    max-concurrent-streams: ${CROWSSH_SSE_MAX_CONCURRENT_STREAMS:50}
    heartbeat-pool-size: ${CROWSSH_SSE_HEARTBEAT_POOL_SIZE:2}
