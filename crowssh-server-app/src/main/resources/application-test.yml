server:
  port: 8091

crowssh:
  crypto:
    allow-insecure-development-key: true
  session:
    idle-timeout-millis: 1800000
    reap-interval-ms: 60000
    max-sessions-per-owner: 10
  db:
    session:
      idle-timeout-millis: 1800000
      reap-interval-ms: 60000
      max-sessions-per-owner: 10
      max-sessions-global: 50
    egress:
      allowed-private-hosts: 127.0.0.1,localhost
      allowed-tunnel-targets: ""
  react:
    max-steps: 50
    max-tool-calls: 200
    max-tool-calls-per-round: 10
    token-budget: 8000
    wall-clock-timeout-millis: 600000
  # SSE 流式执行器：并发上限（背压）/ 心跳线程数
  sse:
    max-concurrent-streams: 50
    heartbeat-pool-size: 2
# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

